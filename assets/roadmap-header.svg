<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Portfolio roadmap">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20232a"/>
      <stop offset="1" stop-color="#101217"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#61dafb" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#61dafb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="240" rx="24" fill="url(#background)"/>
  <circle cx="1040" cy="120" r="180" fill="url(#glow)"/>
  <g transform="translate(1020 120)" fill="none" stroke="#61dafb" stroke-width="5" opacity="0.9">
    <ellipse rx="86" ry="32"/>
    <ellipse rx="86" ry="32" transform="rotate(60)"/>
    <ellipse rx="86" ry="32" transform="rotate(120)"/>
    <circle r="11" fill="#61dafb" stroke="none"/>
  </g>
  <text x="72" y="98" fill="#61dafb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">ENGINEERING PORTFOLIO</text>
  <text x="72" y="154" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Product roadmap</text>
  <text x="72" y="194" fill="#b8c1cc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">From polished case studies to production-ready full-stack and AI systems.</text>
</svg>
